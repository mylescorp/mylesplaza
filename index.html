const tmp=new V();let lastTour=0,last=0,ema=16,slow=0,fpsT=0,frames=0,born=0,fpsShow=60;

c.th+=(gl2.th-c.th)*.07;c.ph+=(gl2.ph-c.ph)*.07;c.r+=(gl2.r-c.r)*.07;c.t.lerp(gl2.t,.07);

if(st.labels||st.measure){ZONES.forEach((z,i)=>{const l=LB[i];if(!st.labels){l.style.display='none';return}

const inside=Math.abs(Cam.position.x-z.x)<z.w/2&&Math.abs(Cam.position.z-z.z)<z.d/2&&Cam.position.y<4.3;
tmp.set(z.x,2.9,z.z);const dist=Cam.position.distanceTo(tmp);const dir=tmp.clone().sub(Cam.position).normalize();labelRay.set(Cam.position,dir);labelRay.far=dist-.15;
const blocked=labelRay.intersectObjects(S.children,true).length>0;
tmp.project(Cam);if(tmp.z>1||!inside||blocked){l.style.display='none';return}l.style.display='';
l.textContent=z.short+(st.measure?' · '+z.w+'×'+z.d+' m':'')+(Z[z.id].ghost?' · P'+z.phase:'');l.classList.toggle('dim',Z[z.id].ghost);
l.style.transform='translate('+((tmp.x*.5+.5)*innerWidth)+'px,'+((-tmp.y*.5+.5)*innerHeight)+'px) translate(-50%,-50%)'});
if(st.measure){tmp.set(0,.3,-6.7-SH).project(Cam);SHOPLB.style.transform='translate('+((tmp.x*.5+.5)*innerWidth)+'px,'+((-tmp.y*.5+.5)*innerHeight)+'px) translate(-50%,-50%)'}}
R.render(S,Cam);
/* adaptive quality and fps readout */

requestAnimationFrame(frame)}

(function(){const coarse=matchMedia('(pointer:coarse)').matches;if(innerWidth<700)Q='low';else if(coarse)Q='medium';
const z0=hashR();size();applyQ();setPhase(phase);apply();lighting(st.night?1:0,true);nightT=st.night?1:0;tiers();fly(z0||'all',true)})();
